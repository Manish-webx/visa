<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 52" width="260" height="52" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfba73" />
      <stop offset="50%" stop-color="#c5a059" />
      <stop offset="100%" stop-color="#9e7832" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172a45" />
      <stop offset="100%" stop-color="#0a192f" />
    </linearGradient>
  </defs>

  <!-- Logo Icon Container -->
  <g transform="translate(4, 4)">
    <!-- Rounded Shield Background -->
    <rect width="44" height="44" rx="11" fill="url(#goldGrad)" />
    <!-- Inner Dark Frame -->
    <rect x="2" y="2" width="40" height="40" rx="9" fill="url(#bgGrad)" />
    
    <!-- Passport / UAE Skyline Icon Details in Gold -->
    <!-- Passport Book Outline -->
    <rect x="13" y="11" width="18" height="22" rx="3" stroke="url(#goldGrad)" stroke-width="1.8" fill="none" />
    <!-- Passport Emblem Star / Seal -->
    <circle cx="22" cy="19" r="3.5" stroke="url(#goldGrad)" stroke-width="1.4" fill="rgba(197, 160, 89, 0.2)" />
    <path d="M22 17 L22 21 M20 19 L24 19" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round" />
    <!-- Passport Line Accents -->
    <path d="M16 26 L28 26 M16 29 L24 29" stroke="url(#goldGrad)" stroke-width="1.4" stroke-linecap="round" />
    
    <!-- Fast-Track Lightning Spark in Corner -->
    <path d="M30 8 L27 14 L30 14 L26 21 L31 13 L28 13 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Brand Typography -->
  <!-- DUBAIVISA -->
  <text x="60" y="27" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="20" letter-spacing="-0.3" fill="#ffffff">
    DUBAI<tspan fill="url(#goldGrad)">VISA</tspan>
  </text>
  
  <!-- Subtitle -->
  <text x="60.5" y="42" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="8.5" letter-spacing="1.8" fill="#94a3b8" text-transform="uppercase">
    EXPRESS &amp; REGULAR SERVICES
  </text>
</svg>
